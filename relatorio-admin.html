<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dashboard.css">
    <title>Refeição Consciente - Relatório Mensal</title>
</head>
<body>
    <header class="top-bar">
        <h1>Relatórios Mensais de Merenda</h1>
        <div><button onclick="sair()" class="btn-sair">Sair</button></div>
    </header>

    <main class="main-container">
        <div class="card-panel">
            <h2>Filtrar Por Mês e Ano</h2>
            <div style="display: flex; gap: 15px; margin-top: 15px; align-items: center; flex-wrap: wrap;">
                <div>
                    <label for="select-mes">Mês:</label>
                    <select id="select-mes">
                        <option value="01">Janeiro</option>
                        <option value="02">Fevereiro</option>
                        <option value="03">Março</option>
                        <option value="04">Abril</option>
                        <option value="05">Maio</option>
                        <option value="06">Junho</option>
                        <option value="07">Julho</option>
                        <option value="08">Agosto</option>
                        <option value="09" selected>Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div>
                    <label for="select-ano">Ano:</label>
                    <select id="select-ano">
                        <option value="2026" selected>2026</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <div style="align-self: flex-end;">
                    <button class="btn-primary" onclick="buscarRelatorioMensal()">Gerar Relatório</button>
                </div>
            </div>
        </div>

        <div class="summary-cards">
            <div class="card-metric total-main">
                <h3>Total Servido no Mês</h3>
                <p id="total-mes">0</p>
            </div>
        </div>

        <div class="card-panel">
            <h3>Detalhamento por Dia</h3>
            <table>
                <thead>
                    <tr><th>Data</th><th>Turno</th><th>Quantidade</th></tr>
                </thead>
                <tbody id="tabela-relatorio">
                    <tr><td colspan="3">Selecione o mês e clique em "Gerar Relatório".</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="js/relatorio.js"></script>
</body>
</html>
