<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/dashboard.css">
    <title>Painel da Cozinha</title>
</head>
<body>
    <header class="top-bar">
        <div>Operador: <strong id="nome-usuario-logado">Carregando...</strong></div>
        <button class="btn-sair" onclick="sair()">Sair</button>
    </header>

    <main class="main-container">
        <section class="summary-cards">
            <div class="card-metric total-main"><h3>Total Refeições</h3><p id="total-geral">0</p></div>
            <div class="card-metric"><h3>Manhã</h3><p id="total-manha">0</p></div>
            <div class="card-metric"><h3>Tarde</h3><p id="total-tarde">0</p></div>
            <div class="card-metric"><h3>Noite</h3><p id="total-noite">0</p></div>
        </section>

        <div class="card-panel">
            <h2>Detalhamento das Salas</h2>
            <table>
                <thead>
                    <tr><th>Sala</th><th>Turno</th><th>Quantidade</th></tr>
                </thead>
                <tbody id="dadosMerenda"></tbody>
            </table>
        </div>
    </main>
    <script src="js/cozinha.js"></script>
</body>
</html>
